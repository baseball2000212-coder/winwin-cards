name: collect-etf-bars
on:
  workflow_dispatch:          # 수동 실행만 (매일 자동 수집 없음)
    inputs:
      start:
        description: '과거 탐색 하한 YYYYMMDD'
        default: '20251001'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: KST 날짜 (토큰 캐시 키)
        id: d
        run: echo "day=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_OUTPUT
      - name: 접근토큰 캐시
        uses: actions/cache@v4
        with:
          path: .tokencache
          key: kis-token-${{ steps.d.outputs.day }}
      - name: collect
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:        prod
          KQ_START:       ${{ github.event.inputs.start || '20251001' }}
        run: PYTHONPATH=scripts python scripts/collect_etf_bars.py
      - name: commit
        run: |
          git config user.name  "kis-bot"
          git config user.email "kis-bot@users.noreply.github.com"
          git add -A data/etf_1min || true
          git diff --staged --quiet && exit 0
          git commit -m "etf 1min $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git pull --rebase origin main && git push
