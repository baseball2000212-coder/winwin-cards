name: collect-us
on:
  # 화~토 06:58 KST. Claude 예약 작업이 workflow_dispatch로 실행한다. GitHub schedule은 몇 시간씩 밀려서 뺐다.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: KST 날짜 (토큰 캐시 키)
        id: d
        run: echo "day=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_OUTPUT
      - name: 접근토큰 캐시
        uses: actions/cache@v4
        with:
          path: .tokencache
          key: kis-token-${{ steps.d.outputs.day }}
      - name: collect
        working-directory: .
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:        prod
        run: mkdir -p data && PYTHONPATH=scripts python scripts/collect_us.py
      - name: commit
        run: |
          git config user.name  "kis-bot"
          git config user.email "kis-bot@users.noreply.github.com"
          git add -A data || true
          git diff --staged --quiet || git commit -m "us $(TZ=Asia/Seoul date +%F\ %H:%M)"
          git pull --rebase origin main && git push
